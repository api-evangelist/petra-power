description: Petra Power is an on-site power generation company based in Solon, Ohio, and backed by
  Techstars, building rapidly deployable, high-efficiency generation systems positioned as "the next
  100GW of on-site power." Its technology runs on natural gas, diesel, or hydrogen, claims up to 3x
  fuel savings versus conventional generators and turbines, and operates silently and odorlessly for
  use in populated areas. Target applications include data centers, critical backup power, heavy
  industry, and utility-scale deployment. Petra Power is a hardware/energy company with no public
  developer or API surface; this profile is maintained in the API Evangelist network as a company
  record.
